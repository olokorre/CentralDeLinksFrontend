name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build-only
      - name: Publicar artifact do build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Empacotar dist
        run: tar -C dist -czf /tmp/front-dist.tar.gz .
      - name: Deploy no servidor de producao
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -o IdentitiesOnly=yes /tmp/front-dist.tar.gz "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'sh ~/deploy/central-de-links/ci/deploy-front.sh'
